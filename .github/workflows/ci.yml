name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Verificar ordens de convergência e conservação de energia
        run: make teste

      - name: Conferir que os CSVs foram gerados
        run: |
          test -s saida/orbita_trajetoria.csv
          test -s saida/orbita_energia.csv
          test -s saida/orbita_convergencia.csv
          test -s saida/orbita_convergencia_energia.csv
