name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Rodar os modelos
        run: make run

      - name: Verificar resultados
        run: |
          test -s saida/radiacao_espessura.csv
          test -s saida/reentrada_perfil.csv
          err=$(cd saida && ../bin/calor1d | grep "perfil final" | sed -E 's/.*CN=([0-9.eE+-]+) K.*/\1/')
          echo "Erro CN: $err K"
          awk -v e="$err" 'BEGIN { exit !(e < 1.0) }'
